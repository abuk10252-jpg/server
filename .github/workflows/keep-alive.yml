name: Keep Render Alive

on:
  schedule:
    - cron: '*/5 * * * *'   # كل 10 دقايق
  workflow_dispatch:         # عشان تقدر تشغّله يدوياً من GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App
        run: |
          curl -sS --max-time 60 -o /dev/null -w "%{http_code}" https://server-3xn9.onrender.com/api/health | grep -q 200
