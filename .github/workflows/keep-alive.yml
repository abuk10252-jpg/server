name: Keep Render Alive

on:
  schedule:
    - cron: '*/5 * * * *'   # كل 10 دقايق
  workflow_dispatch:         # عشان تقدر تشغّله يدوياً من GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App
        run: |
          curl -s -o /dev/ https://server-3xn9.onrender.com/api/health
